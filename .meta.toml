# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[tox]
package_name = "design.plone.contenttypes"
# Pins shared with iocomune-backend (dependabot/plone6x/requirements.txt), without
# design.plone.contenttypes itself. Refreshed daily by .github/workflows/update-constraints.yml.
constraints_files = {"6.2" = "constraints/plone62.txt", "6.1" = "constraints/plone61.txt", "6.0" = "constraints/plone60.txt"}
# Support Plone 6.0, 6.1 and 6.2 (Python 3.11+) only.
test_matrix = {"6.2" = ["3.14", "3.13", "3.12", "3.11"], "6.1" = ["3.13", "3.12", "3.11"], "6.0" = ["3.13", "3.12", "3.11"]}
# dist.plone.org's 6.2-dev constraints pin Zope==6.2; experimental.noacquisition
# (pulled in transitively via redturtle.volto) only supports that from 1.1.0b1.
test_deps_additional = "experimental.noacquisition==1.1.0b1"

[github]
# Pin the reusable workflow ref to a commit SHA (plone/meta@2.x)
# to satisfy CodeQL's "unpinned tag for a non-immutable action" check.
ref = "f3bf7140b6272dd21e793a92a4366c9c17ef6e10"

[pyproject]
dependencies_mappings = [
    "setuptools = ['pkg_resources']",
]
# .coveragerc is used by the coverage tox env but doesn't need to ship in the sdist.
check_manifest_ignores = """
    ".coveragerc",
    "constraints/*",
"""
# Not imported directly, but required at test-run time: plone.restapi.testing
dependencies_ignores = "['collective.MockMailHost']"
codespell_skip = "*.po,*.pot,*.pt,*.xml,*.zcml,*.json,README.md,CHANGES.rst"
# Italian words used in code, comments and user-facing labels, not typos.
codespell_ignores = "possibile,nome,termine,strutture,momento,amministrative,collegate,stati,alle,parma,serie,ore,fase,differente,visibile,impossibile,foto,aplha,tre,allo,compatibile,esclude"

[pre_commit]
# Maintenance views for site administrators, not part of the translated UI.
i18ndude_extra_lines = """
        exclude: ^src/design/plone/contenttypes/browser/utils/templates/.*\\.pt$
"""
